<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Ramen — a night-shift cooking game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a1a; min-height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }
  h1 { color: #ffb347; font-size: 20px; margin: 14px 0 4px; letter-spacing: 1px; }
  p.hint { color: #9a9ac4; font-size: 13px; margin: 0 0 12px; }
  canvas { width: 1280px; max-width: 96vw; height: auto; border: 2px solid #f08c1e; border-radius: 8px; background: #12122b; }
</style>
</head>
<body>
<h1>🍜 MIDNIGHT RAMEN</h1>
<p class="hint">Boil noodles, build each bowl to match its ticket, serve before the timer dies. Mouse + keyboard (1–6, N, SPACE, T, P).</p>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
